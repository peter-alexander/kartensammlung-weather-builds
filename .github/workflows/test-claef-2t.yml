name: Test C-LAEF Temperature Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: test-claef-2t-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PMTILES_BIN: ${{ github.workspace }}/.local/bin/pmtiles
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install '.[dev]'

      - name: Run prototype and encoding tests
        run: |
          python -m pytest -q \
            tests/test_claef_2t_prototype.py \
            tests/test_numeric_tiles.py \
            tests/test_tile_png.py \
            tests/test_tile_manifest.py \
            tests/test_quantization_contracts.py

      - name: Install pinned PMTiles CLI
        run: |
          mkdir -p "$(dirname "$PMTILES_BIN")"
          curl --fail --silent --show-error --location \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.30.1/go-pmtiles_1.30.1_Linux_x86_64.tar.gz \
            | tar -xz -C "$(dirname "$PMTILES_BIN")" pmtiles
          "$PMTILES_BIN" version

      - name: Build six C-LAEF temperature frames
        run: |
          python scripts/build_claef_2t_prototype.py \
            --output out-claef-2t \
            --min -50 \
            --max 60 \
            --min-zoom 5 \
            --max-zoom 10 \
            --frames 6 \
            --pmtiles-binary "$PMTILES_BIN"

      - name: Verify output and archive
        run: |
          test -s out-claef-2t/source-2t.nc
          test -s out-claef-2t/2t-f001.pmtiles
          test -s out-claef-2t/manifest.json
          for file in out-claef-2t/2t-f???.pmtiles; do
            "$PMTILES_BIN" verify "$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from weather_build.tile_manifest import validate_manifest

          directory = Path("out-claef-2t")
          manifest = validate_manifest(json.loads((directory / "manifest.json").read_text(encoding="utf-8")))
          for variable in manifest["variables"]:
          	assert len(variable["frames"]) == 6
          	for frame in variable["frames"]:
          		assert (directory / frame["href"]).is_file(), frame["href"]
          print("Verified:", [f["href"] for v in manifest["variables"] for f in v["frames"]])
          PY

      - name: Package standalone browser demo
        run: |
          mkdir -p out-claef-2t/demo
          cp web/claef-demo/index.html web/claef-demo/demo.mjs out-claef-2t/demo/
          cp web/numeric-weather-decoder.mjs out-claef-2t/

      - name: Upload prototype for inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claef-2t-prototype
          path: |
            out-claef-2t/manifest.json
            out-claef-2t/*.pmtiles
            out-claef-2t/*.mbtiles
            out-claef-2t/source-2t.nc
            out-claef-2t/demo/
            out-claef-2t/numeric-weather-decoder.mjs
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: geosphere-weather-pages-publisher
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install manifest validator
        run: python -m pip install '.[dev]'

      - name: Download verified test build
        uses: actions/download-artifact@v6
        with:
          name: claef-2t-prototype
          path: out-claef-2t

      - name: Publish immutable CLAEF temperature version
        env:
          LOCAL_DIR: out-claef-2t
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-claef-2t-pages.sh

      - name: Upload complete Pages snapshot
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/weather-pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
