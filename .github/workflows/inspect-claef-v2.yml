name: Inspect C-LAEF AlpeAdria v2 dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install API client
        run: python -m pip install requests
      - name: Inspect model metadata and parameter semantics
        run: python scripts/inspect-claef-v2.py
      - name: Upload raw metadata and analysis
        uses: actions/upload-artifact@v4
        with:
          name: claef-v2-metadata
          path: |
            claef-v2-metadata.json
            claef-v2-report.json
          if-no-files-found: error
          retention-days: 7
